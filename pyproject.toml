[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyzen"
version = "0.1.0"
description = "Lightweight tool-calling AI runtime"
requires-python = ">=3.9"

[project.scripts]
pyzen = "pyzen.cli:main"

[tool.setuptools.packages.find]
include = ["pyzen*"]
